name: weekly-backtest
on:
  schedule:
    - cron: "0 18 * * 6"   # 台灣時間每週日 02:00：重新計算訊號回測
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-run
  cancel-in-progress: false
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f update.zip ]; then unzip -o update.zip; fi
          test -f backtest.py || { echo "::error::找不到 backtest.py，請重新上傳最新的 update.zip"; exit 1; }
          test -f docs/stocks.json || { echo "::error::找不到 docs/stocks.json，請先執行一次 daily-screener"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python backtest.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/backtest.json
          git commit -m "backtest" || echo "no changes"
          git checkout -- .
          git pull --rebase
          git push
