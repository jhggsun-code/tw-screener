name: daily-screener
on:
  schedule:
    - cron: "0 0 * * 1-5"    # 台灣時間 08:00：整理美股收盤與前一日台股
    - cron: "30 6 * * 1-5"   # 台灣時間 14:30：台股收盤後，更新當日收盤與訊號（官方資料未公布會自動等待）
    - cron: "0 10 * * 1-5"   # 台灣時間 18:00：補跑一次，確保當日收盤資料完整
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 解壓縮更新檔
        run: |
          if [ -f update.zip ]; then unzip -o update.zip; fi
      - name: 檢查檔案是否齊全
        run: |
          ls -la
          for f in screener.py extras.py us.py cal.py events.py twse.py page.html app.css app.js; do
            if [ ! -f "$f" ]; then
              echo "::error::找不到 $f，請確認 update.zip 已上傳到專案最外層，且檔名完全一致"
              exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - run: python screener.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "update" || echo "no changes"
          git checkout -- .
          git pull --rebase
          git push
