name: intraday-quotes
on:
  schedule:
    - cron: "*/15 1-6 * * 1-5"    # 台灣時間 09:00～14:45，每約15分鐘更新台股報價
    - cron: "*/20 7-12 * * 1-5"   # 台灣時間 15:00～20:40，收盤後改用官方收盤資料更新
    - cron: "*/20 13-21 * * 1-5"  # 台灣時間 21:00～05:59，每約20分鐘更新美股報價
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quotes
  cancel-in-progress: true
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f update.zip ]; then unzip -o update.zip; fi
          test -f quotes.py || { echo "::error::找不到 quotes.py，請重新上傳最新的 update.zip"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - run: python quotes.py
        env:
          QMODE: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}
      - name: 推送報價到 quotes 分支（每次覆蓋，不累積歷史）
        run: |
          cd quotes_out
          git init -q -b quotes
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add quotes.json
          git commit -qm "quotes"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin quotes
